<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" width="260" height="140">
  <defs>
    <!-- Soviet 4BO Matte Olive-Green Gradients -->
    <linearGradient id="hullBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#324025"/>
      <stop offset="50%" stop-color="#415230"/>
      <stop offset="100%" stop-color="#4b5e38"/>
    </linearGradient>
    <linearGradient id="glacisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#495b37"/>
      <stop offset="65%" stop-color="#5a6f44"/>
      <stop offset="100%" stop-color="#4e613b"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191b18"/>
      <stop offset="50%" stop-color="#2a2d28"/>
      <stop offset="100%" stop-color="#151714"/>
    </linearGradient>
    <linearGradient id="fenderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38472a"/>
      <stop offset="50%" stop-color="#475936"/>
      <stop offset="100%" stop-color="#313f24"/>
    </linearGradient>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#303d23"/>
      <stop offset="45%" stop-color="#4f613c"/>
      <stop offset="100%" stop-color="#28341d"/>
    </linearGradient>
    <radialGradient id="sootHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141412" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#141412" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grilleMesh" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#151a12"/>
      <path d="M 0 2 L 4 2 M 2 0 L 2 4" stroke="#2c3623" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- LEFT TRACK ASSEMBLY (Port / -Y) -->
  <g id="track-left">
    <rect x="19" y="16" width="222" height="19" rx="2" fill="url(#trackGrad)" stroke="#10120f" stroke-width="1"/>
    <!-- Exposed front idler & rear drive sprocket teeth hints -->
    <circle cx="24" cy="25.5" r="5" fill="#2d3328" stroke="#141712" stroke-width="0.9"/>
    <circle cx="236" cy="25.5" r="4.5" fill="#2d3328" stroke="#141712" stroke-width="0.9"/>
    <!-- Road wheel edge recesses -->
    <g fill="#252e1e" stroke="#141911" stroke-width="0.7">
      <rect x="42" y="15" width="20" height="2.2" rx="0.5"/>
      <rect x="76" y="15" width="20" height="2.2" rx="0.5"/>
      <rect x="110" y="15" width="20" height="2.2" rx="0.5"/>
      <rect x="144" y="15" width="20" height="2.2" rx="0.5"/>
      <rect x="178" y="15" width="20" height="2.2" rx="0.5"/>
    </g>
    <!-- Left Fender -->
    <path d="M 28 17 L 224 17 L 227 21 L 227 35 L 28 35 Z" fill="url(#fenderGrad)" stroke="#181f13" stroke-width="1"/>
    <!-- Fender stiffening ribs & chipped edge highlights -->
    <g stroke="#29341e" stroke-width="0.9">
      <line x1="65" y1="17" x2="65" y2="35"/>
      <line x1="115" y1="17" x2="115" y2="35"/>
      <line x1="165" y1="17" x2="165" y2="35"/>
      <line x1="210" y1="17" x2="210" y2="35"/>
    </g>
    <line x1="30" y1="17.8" x2="222" y2="17.8" stroke="#687a54" stroke-width="0.6" opacity="0.45"/>
  </g>

  <!-- RIGHT TRACK ASSEMBLY (Starboard / +Y) -->
  <g id="track-right">
    <rect x="19" y="105" width="222" height="19" rx="2" fill="url(#trackGrad)" stroke="#10120f" stroke-width="1"/>
    <circle cx="24" cy="114.5" r="5" fill="#2d3328" stroke="#141712" stroke-width="0.9"/>
    <circle cx="236" cy="114.5" r="4.5" fill="#2d3328" stroke="#141712" stroke-width="0.9"/>
    <g fill="#252e1e" stroke="#141911" stroke-width="0.7">
      <rect x="42" y="122.8" width="20" height="2.2" rx="0.5"/>
      <rect x="76" y="122.8" width="20" height="2.2" rx="0.5"/>
      <rect x="110" y="122.8" width="20" height="2.2" rx="0.5"/>
      <rect x="144" y="122.8" width="20" height="2.2" rx="0.5"/>
      <rect x="178" y="122.8" width="20" height="2.2" rx="0.5"/>
    </g>
    <!-- Right Fender -->
    <path d="M 28 105 L 227 105 L 227 119 L 224 123 L 28 123 Z" fill="url(#fenderGrad)" stroke="#181f13" stroke-width="1"/>
    <g stroke="#29341e" stroke-width="0.9">
      <line x1="65" y1="105" x2="65" y2="123"/>
      <line x1="115" y1="105" x2="115" y2="123"/>
      <line x1="165" y1="105" x2="165" y2="123"/>
      <line x1="210" y1="105" x2="210" y2="123"/>
    </g>
    <line x1="30" y1="122.2" x2="222" y2="122.2" stroke="#222a1b" stroke-width="0.7" opacity="0.55"/>
  </g>

  <!-- MAIN HULL BODY -->
  <g id="hull-body">
    <polygon points="24,35 228,35 234,42 234,98 228,105 24,105 20,98 20,42" fill="url(#hullBase)" stroke="#161d10" stroke-width="1.3"/>

    <!-- Subtle Paint Weathering & Oil/Dust Patches -->
    <path d="M 45,36 Q 75,45 95,36 L 118,36 Q 108,58 85,55 Q 60,52 45,36 Z" fill="#2b3720" opacity="0.45"/>
    <path d="M 155,104 Q 180,86 212,96 L 226,104 Z" fill="#28341e" opacity="0.45"/>
    <path d="M 185,40 Q 210,48 225,38 L 228,60 Q 202,65 185,40 Z" fill="#576a42" opacity="0.28"/>

    <!-- Sloped Side Armor Plates (upper bevels + weld lines) -->
    <polygon points="34,35 205,35 196,43 44,43" fill="#3b4c2d" stroke="#1e2717" stroke-width="0.9"/>
    <polygon points="34,105 205,105 196,97 44,97" fill="#303e24" stroke="#1e2717" stroke-width="0.9"/>
    <line x1="44" y1="43" x2="196" y2="43" stroke="#667a50" stroke-width="0.7" opacity="0.45"/>

    <!-- Front Sloped Glacis Plate & Lower Nose Bevel -->
    <polygon points="196,43 228,36 234,42 234,98 228,104 196,97" fill="url(#glacisGrad)" stroke="#1b2315" stroke-width="1.1"/>
    <line x1="228" y1="36" x2="228" y2="104" stroke="#222b1a" stroke-width="1.3"/>
    <line x1="227" y1="37" x2="227" y2="103" stroke="#758a5d" stroke-width="0.65" opacity="0.45"/>

    <!-- Driver's Hatch (Left-front glacis, -Y side) -->
    <g id="driver-hatch">
      <rect x="200" y="46" width="21" height="19" rx="2" fill="#465935" stroke="#1b2315" stroke-width="1.1"/>
      <rect x="204" y="49" width="13" height="13" rx="1" fill="#50653d" stroke="#242e1c" stroke-width="0.8"/>
      <!-- Hatch hinges -->
      <rect x="200" y="49" width="2.5" height="4" fill="#2c3722"/>
      <rect x="200" y="58" width="2.5" height="4" fill="#2c3722"/>
      <!-- Twin driver periscopes with glass tint -->
      <rect x="219" y="49" width="4" height="5" rx="0.8" fill="#232c1b" stroke="#111" stroke-width="0.6"/>
      <rect x="220.8" y="50" width="1.8" height="3" fill="#5b7f8c"/>
      <rect x="219" y="57" width="4" height="5" rx="0.8" fill="#232c1b" stroke="#111" stroke-width="0.6"/>
      <rect x="220.8" y="58" width="1.8" height="3" fill="#5b7f8c"/>
    </g>

    <!-- Spare Track Links on Front Glacis -->
    <g fill="#232621" stroke="#121411" stroke-width="0.7">
      <rect x="219" y="67" width="6" height="9" rx="0.8"/>
      <rect x="219" y="77" width="6" height="9" rx="0.8"/>
      <rect x="219" y="87" width="6" height="9" rx="0.8"/>
    </g>

    <!-- Bow MG Armored Ball Mount Base (Right-front glacis, +Y side) -->
    <circle cx="212" cy="86" r="8" fill="#3a492c" stroke="#171f11" stroke-width="1.1"/>
    <circle cx="212" cy="86" r="5" fill="#4d603b" stroke="#202a18" stroke-width="0.8"/>

    <!-- Front Tow Shackles & Headlight -->
    <rect x="231" y="41" width="5" height="4" rx="1" fill="#252e1d" stroke="#111" stroke-width="0.6"/>
    <rect x="231" y="95" width="5" height="4" rx="1" fill="#252e1d" stroke="#111" stroke-width="0.6"/>
    <circle cx="212" cy="39" r="3" fill="#2c3722" stroke="#141a0f" stroke-width="0.7"/>
    <circle cx="213.5" cy="39" r="1.4" fill="#d9e0c8" opacity="0.8"/>

    <!-- Turret Ring Seat (centered at x=144, y=70) -->
    <circle cx="144" cy="70" r="34" fill="#2c3822" stroke="#1a2214" stroke-width="1.2"/>
    <circle cx="144" cy="70" r="30" fill="#222b1a"/>

    <!-- Engine Deck & Radiator Grilles (Rear center) -->
    <g id="engine-deck">
      <rect x="46" y="43" width="56" height="54" rx="2" fill="#3b4b2c" stroke="#1b2315" stroke-width="1"/>
      <rect x="52" y="46" width="26" height="48" rx="1" fill="url(#grilleMesh)" stroke="#182012" stroke-width="1"/>
      <line x1="52" y1="62" x2="78" y2="62" stroke="#425332" stroke-width="2.2"/>
      <line x1="52" y1="78" x2="78" y2="78" stroke="#425332" stroke-width="2.2"/>
      <g fill="#1c2317" stroke="#2c3822" stroke-width="0.6">
        <rect x="82" y="47" width="14" height="10" rx="1"/>
        <rect x="82" y="65" width="14" height="10" rx="1"/>
        <rect x="82" y="83" width="14" height="10" rx="1"/>
      </g>
      <rect x="82" y="61" width="16" height="18" rx="1.5" fill="#465835" stroke="#1d2616" stroke-width="0.9"/>
      <!-- Subtle oil/soot stain on engine access deck -->
      <ellipse cx="90" cy="70" rx="6" ry="5" fill="#181a14" opacity="0.28"/>
    </g>

    <!-- Rear Transmission Deck & Exhausts -->
    <g id="rear-deck">
      <polygon points="24,42 46,43 46,97 24,98 20,93 20,47" fill="#364528" stroke="#192113" stroke-width="1"/>
      <ellipse cx="32" cy="70" rx="6.5" ry="10" fill="#435433" stroke="#1b2315" stroke-width="0.9"/>
      <!-- Exhaust soot halos -->
      <circle cx="24" cy="48.5" r="8" fill="url(#sootHalo)"/>
      <circle cx="24" cy="91.5" r="8" fill="url(#sootHalo)"/>
      <!-- Exhaust pipe armored shrouds -->
      <rect x="26" y="45" width="12" height="7" rx="2.5" fill="#2a3420" stroke="#12170e" stroke-width="0.9"/>
      <rect x="26" y="88" width="12" height="7" rx="2.5" fill="#2a3420" stroke="#12170e" stroke-width="0.9"/>
      <rect x="17" y="47" width="4" height="5" rx="1" fill="#252e1d" stroke="#111" stroke-width="0.6"/>
      <rect x="17" y="88" width="4" height="5" rx="1" fill="#252e1d" stroke="#111" stroke-width="0.6"/>
    </g>

    <!-- External Cylindrical Fuel Drums -->
    <g id="fuel-drums-left">
      <rect x="36" y="18" width="24" height="12" rx="4" fill="url(#drumGrad)" stroke="#182012" stroke-width="0.9"/>
      <line x1="42" y1="18" x2="42" y2="30" stroke="#1d2616" stroke-width="1"/>
      <line x1="54" y1="18" x2="54" y2="30" stroke="#1d2616" stroke-width="1"/>
      <rect x="63" y="18" width="24" height="12" rx="4" fill="url(#drumGrad)" stroke="#182012" stroke-width="0.9"/>
      <line x1="69" y1="18" x2="69" y2="30" stroke="#1d2616" stroke-width="1"/>
      <line x1="81" y1="18" x2="81" y2="30" stroke="#1d2616" stroke-width="1"/>
    </g>
    <g id="fuel-drum-right">
      <rect x="42" y="110" width="26" height="12" rx="4" fill="url(#drumGrad)" stroke="#182012" stroke-width="0.9"/>
      <line x1="48" y1="110" x2="48" y2="122" stroke="#1d2616" stroke-width="1"/>
      <line x1="62" y1="110" x2="62" y2="122" stroke="#1d2616" stroke-width="1"/>
    </g>

    <!-- Tow Cable along Left Fender -->
    <path d="M 92 22 L 198 22 Q 204 22 204 25 Q 204 28 198 28 L 192 28" fill="none" stroke="#30352c" stroke-width="1.9" stroke-linecap="round"/>

    <!-- Hull Side Grab Handles -->
    <g stroke="#212a19" stroke-width="1.2" fill="none">
      <path d="M 105 37 L 105 35 L 125 35 L 125 37"/>
      <path d="M 155 37 L 155 35 L 175 35 L 175 37"/>
      <path d="M 105 103 L 105 105 L 125 105 L 125 103"/>
      <path d="M 155 103 L 155 105 L 175 105 L 175 103"/>
    </g>
  </g>
</svg>
