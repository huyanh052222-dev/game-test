<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38">
  <!-- Subtle ground contact shadow -->
  <ellipse cx="18" cy="20" rx="10" ry="11" fill="#000000" opacity="0.26"/>

  <!-- Boots peeking under tunic -->
  <rect x="13" y="12.5" width="5" height="3.2" rx="1.2" fill="#232220" stroke="#111" stroke-width="0.6"/>
  <rect x="13" y="22.3" width="5" height="3.2" rx="1.2" fill="#232220" stroke="#111" stroke-width="0.6"/>

  <!-- Feldgrau Uniform Shoulders & Torso -->
  <ellipse cx="17" cy="19" rx="6.2" ry="9.5" fill="#5a6556" stroke="#1e241c" stroke-width="1"/>
  <!-- Webbing Y-straps & belt pack -->
  <path d="M 12,15 L 18,19 L 12,23" fill="none" stroke="#2d302a" stroke-width="1.4"/>
  <rect x="11.5" y="16" width="3" height="6" rx="0.8" fill="#3a4036" stroke="#1a1e18" stroke-width="0.6"/>

  <!-- Arms holding Kar98k -->
  <path d="M 18,11.5 Q 23,13 24,17" fill="none" stroke="#535e4f" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M 18,26.5 Q 22,23 23,20.5" fill="none" stroke="#535e4f" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Kar98k Rifle (wooden stock + steel barrel pointing +X) -->
  <line x1="17" y1="21.5" x2="29" y2="17.5" stroke="#5c4028" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="25" y1="18.8" x2="35.5" y2="15.3" stroke="#262a2d" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Stahlhelm Helmet (flared rim + crown) -->
  <ellipse cx="18.5" cy="19" rx="5.6" ry="5.2" fill="#4b5347" stroke="#191e17" stroke-width="1"/>
  <ellipse cx="19.2" cy="19" rx="4.0" ry="3.8" fill="#5d6658" stroke="#2b3128" stroke-width="0.7"/>
</svg>
